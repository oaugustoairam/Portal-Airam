# Configuração das funções do servidor (usada pelo comando `supabase functions deploy`)
[functions.zapsign-webhook]
verify_jwt = false   # o ZapSign chama sem login; a função confere o header x-airam-segredo

[functions.enviar-notificacoes]
verify_jwt = false   # chamada pelo agendador do banco; a função confere o segredo ou o login da equipe

[functions.recuperar-senha]
verify_jwt = false   # o cliente ainda não está logado

[functions.redefinir-senha]
verify_jwt = false   # o cliente ainda não está logado; a função confere o código

[functions.descadastrar]
verify_jwt = false   # aberto pelo link do e-mail; confere o token

[functions.aniversarios-do-dia]
verify_jwt = false   # chamado pelo agendador; confere o segredo

[functions.entrar-cpf]
verify_jwt = false   # o cliente ainda não está logado; a função confere a senha
